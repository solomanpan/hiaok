# docker compose up -d --build                 # postgres master+slave, redis, migrate, api, worker
# docker compose --profile kafka up -d --build # + kafka (then set APP_BROKER=kafka)
name: hiaok

x-app: &app
  build: .
  image: hiaok:latest
  environment: &app-env
    APP_ENV: docker
    APP_BROKER: ${APP_BROKER:-redis}
    APP_CACHE: redis
    DB_MASTER_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-master:5432/hiaok
    DB_SLAVE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-slave:5432/hiaok
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-pg-env: &pg-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: hiaok
  REPLICATION_USER: replicator
  REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
  REPLICATION_SLOT: replica_1
  PGDATA: /var/lib/postgresql/data

services:
  postgres-master:
    image: postgres:17-alpine
    environment: *pg-env
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    volumes:
      - pg-master:/var/lib/postgresql/data
      - ./docker/postgres/master-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    ports: ["5432:5432"]
    healthcheck: # TCP on purpose: the init-time temp server only listens on the unix socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d hiaok"]
      interval: 3s
      retries: 30

  postgres-slave:
    image: postgres:17-alpine
    user: postgres
    environment:
      <<: *pg-env
      PRIMARY_HOST: postgres-master
    entrypoint: ["/bin/sh", "/docker/slave-entrypoint.sh"]
    volumes:
      - pg-slave:/var/lib/postgresql/data
      - ./docker/postgres/slave-entrypoint.sh:/docker/slave-entrypoint.sh:ro
    ports: ["5433:5432"]
    depends_on:
      postgres-master: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  kafka: # single-node KRaft; internal listener for containers, EXTERNAL for the host (localhost:9094)
    image: apache/kafka:3.8.0
    profiles: ["kafka"]
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  migrate: # one-shot: schema is owned by Alembic and always applied on the master
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres-master: { condition: service_healthy }

  api:
    <<: *app
    command: ["hiaok"]
    environment:
      <<: *app-env
      APP_CONSUME_EVENTS: "false" # the worker consumes; API nodes only publish
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres-slave: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["hiaok", "worker"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pg-master:
  pg-slave:
